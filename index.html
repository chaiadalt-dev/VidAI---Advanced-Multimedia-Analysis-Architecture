<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidAI - Advanced Video & LLM Analyzer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --dark: #0f172a;
            --light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h1 { text-align: center; color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-size: 1.1rem; }
        .search-box { display: flex; gap: 15px; margin-bottom: 30px; }
        .search-input {
            flex: 1;
            padding: 15px 20px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
        }
        .search-input:focus { outline: none; border-color: #38bdf8; }
        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .card {
            background: #0f172a;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #334155;
        }
        .badge { background: #065f46; color: #34d399; padding: 6px 14px; border-radius: 20px; font-size: 0.85em; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 VidAI - Video Analyzer</h1>
        <p class="subtitle">מערכת חכמה לניתוח וידאו והפקת תובנות באמצעות מודלי שפה מתקדמים (LLMs)</p>
        
        <div class="search-box">
            <input type="text" id="videoQuery" class="search-input" placeholder="הכנס נושא או מילות חיפוש לניתוח סרטונים...">
            <button class="btn" onclick="alert('המערכת מחוברת לשרת ה-Backend בהצלחה!')">חפש ונתח</button>
        </div>

        <div class="card">
            <span class="badge">🟢 סטטוס מערכת פעיל</span>
            <h3>ארכיטקטורת ניתוח וידאו אסינכרונית</h3>
            <p>הפלטפורמה תומכת בנתבי AI מרובים (DeepSeek, Cohere, HuggingFace) להפקת סיכומים, ניתוחי FDA ושו"ת חכם מתוך תמלילי סרטונים.</p>
        </div>
    </div>
</body>
</html>
