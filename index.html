<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidAI – Mental Health Scientific Rating</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #7c3aed;
            --dark: #0f172a;
            --light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--light);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #1e293b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #334155;
        }
        h1 { text-align: center; color: #38bdf8; font-size: 2.2rem; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 35px; font-size: 1.05rem; }
        .search-box { display: flex; gap: 12px; margin-bottom: 25px; }
        .search-input {
            flex: 1;
            padding: 14px 18px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .search-input:focus { outline: none; border-color: #38bdf8; }
        .btn {
            padding: 14px 26px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .card {
            background: #0f172a;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #334155;
            margin-top: 20px;
        }
        .badge { background: #065f46; color: #34d399; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; font-weight: bold; display: inline-block; margin-bottom: 12px; }
        #result { margin-top: 20px; display: none; }
        .score { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VidAI – דירוג מדעי</h1>
        <p class="subtitle">הערכת רמת המדעיות של סרטוני בריאות הנפש</p>

        <div class="search-box">
            <input type="text" id="videoQuery" class="search-input" placeholder="הכנס נושא / כותרת סרטון (למשל: CBT depression)">
            <button class="btn" onclick="analyze()">נתח</button>
        </div>

        <div class="card">
            <span class="badge">מערכת פעילה</span>
            <p>המערכת בודקת האם התוכן מבוסס מחקר, משתמש במונחים מדעיים, ומציג ציון מדעיות (0-100) + נימוק קצר.</p>
        </div>

        <div id="result" class="card">
            <div class="score" id="score">—</div>
            <p id="explanation"></p>
        </div>
    </div>

    <script>
        async function analyze() {
            const query = document.getElementById('videoQuery').value.trim();
            if (!query) {
                alert('הכנס נושא');
                return;
            }

            document.getElementById('result').style.display = 'block';
            document.getElementById('score').textContent = 'טוען...';
            document.getElementById('explanation').textContent = '';

            try {
                const res = await fetch('/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: query})
                });
                const data = await res.json();
                document.getElementById('score').textContent = data.score + ' / 100';
                document.getElementById('explanation').textContent = data.explanation;
            } catch (e) {
                document.getElementById('score').textContent = 'שגיאה';
                document.getElementById('explanation').textContent = 'לא ניתן להתחבר לשרת כרגע';
            }
        }
    </script>
</body>
</html>
